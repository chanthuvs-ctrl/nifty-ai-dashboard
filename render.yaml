services:
  - type: web
    name: de-natura-finance-admin
    env: node
    plan: free
    buildCommand: cd finance-admin-app && npm install && npx vite build
    startCommand: cd finance-admin-app && node server.cjs
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 10000
